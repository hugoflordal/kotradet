# Publishes web/ to GitHub Pages on every push to main.
# Enable once: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages lets browsers cache files for 10 minutes. Give the scripts a new URL
      # per commit so a reload always gets the version just published.
      - name: Version script URLs
        run: |
          v=${GITHUB_SHA::8}
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$v\"|" web/index.html
          sed -i -E "s#from '\./([a-z]+\.js)'#from './\1?v=$v'#" web/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
